<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>نظام EMIS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="js/tailwind-config.js"></script>
  <link rel="stylesheet" href="css/styles.css" />
  <style>
    body {
      background: radial-gradient(circle at 15% 10%, #dbeafe 0%, transparent 45%),
                  radial-gradient(circle at 85% 15%, #ede9fe 0%, transparent 45%),
                  radial-gradient(circle at 50% 90%, #d1fae5 0%, transparent 50%),
                  #f8fafc;
      min-height: 100vh;
    }
    .gateway-card {
      background: rgba(255, 255, 255, 0.72);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.6);
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
    }
    .gateway-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 20px 40px -12px rgba(15, 23, 42, 0.15);
    }
  </style>
</head>
<body class="font-tajawal text-slate-900 antialiased">
  <div class="mx-auto flex min-h-screen max-w-4xl flex-col items-center justify-center px-4 py-12">
    <div class="mb-10 flex flex-col items-center gap-3 text-center">
      <div class="flex h-16 w-16 items-center justify-center rounded-2xl bg-brand-600 text-2xl font-bold text-white shadow-lg shadow-brand-600/20">E</div>
      <h1 class="text-2xl font-extrabold text-slate-900 sm:text-3xl">نظام EMIS</h1>
      <p class="text-sm text-slate-500 sm:text-base">نظام إدارة معلومات الطلاب والأساتذة</p>
    </div>

    <div class="grid w-full grid-cols-1 gap-5 sm:grid-cols-2">
      <a href="login.html" class="gateway-card group flex flex-col items-center gap-4 rounded-3xl p-8 text-center shadow-lg shadow-slate-200/50">
        <div class="flex h-16 w-16 items-center justify-center rounded-2xl bg-blue-100 text-3xl text-blue-600 shadow-inner transition group-hover:scale-105">🎓</div>
        <div>
          <h2 class="text-lg font-extrabold text-slate-900">معلومات الطلاب</h2>
          <p class="mt-1 text-sm text-slate-500">الدخول إلى نظام EMIS لإدارة بيانات الطلاب</p>
        </div>
        <span class="mt-2 flex items-center gap-1.5 rounded-xl bg-brand-600 px-5 py-2.5 text-sm font-semibold text-white shadow-sm transition group-hover:bg-brand-700">
          تسجيل الدخول ←
        </span>
      </a>

      <a href="teacher-register.html" class="gateway-card group flex flex-col items-center gap-4 rounded-3xl p-8 text-center shadow-lg shadow-slate-200/50">
        <div class="flex h-16 w-16 items-center justify-center rounded-2xl bg-violet-100 text-3xl text-violet-600 shadow-inner transition group-hover:scale-105">👨‍🏫</div>
        <div>
          <h2 class="text-lg font-extrabold text-slate-900">تسجيل الأساتذة</h2>
          <p class="mt-1 text-sm text-slate-500">استمارة تسجيل بيانات الأستاذ — بدون الحاجة لتسجيل دخول</p>
        </div>
        <span class="mt-2 flex items-center gap-1.5 rounded-xl bg-violet-600 px-5 py-2.5 text-sm font-semibold text-white shadow-sm transition group-hover:bg-violet-700">
          فتح الاستمارة ←
        </span>
      </a>
    </div>

    <p class="mt-12 text-center text-xs text-slate-400">حقوق برمجة النظام محفوظة الاستاذ علي محمد علي ❤️</p>
  </div>
</body>
</html>
