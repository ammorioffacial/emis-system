<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>نظام EMIS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="js/tailwind-config.js"></script>
  <link rel="stylesheet" href="css/styles.css" />
  <style>
    body {
      background: #f1f5f9;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Floating animated gradient orbs behind everything */
    .orb {
      position: fixed;
      border-radius: 9999px;
      filter: blur(70px);
      opacity: 0.55;
      pointer-events: none;
      z-index: 0;
    }
    .orb-1 { top: -10%; right: -8%; width: 45vw; height: 45vw; background: radial-gradient(circle, #93c5fd, transparent 70%); animation: float-a 16s ease-in-out infinite; }
    .orb-2 { bottom: -15%; left: -10%; width: 50vw; height: 50vw; background: radial-gradient(circle, #c4b5fd, transparent 70%); animation: float-b 20s ease-in-out infinite; }
    .orb-3 { top: 40%; left: 50%; width: 35vw; height: 35vw; background: radial-gradient(circle, #6ee7b7, transparent 70%); opacity: 0.35; animation: float-c 18s ease-in-out infinite; }
    @keyframes float-a { 0%, 100% { transform: translate(0, 0) scale(1); } 50% { transform: translate(-4%, 5%) scale(1.08); } }
    @keyframes float-b { 0%, 100% { transform: translate(0, 0) scale(1); } 50% { transform: translate(5%, -4%) scale(1.1); } }
    @keyframes float-c { 0%, 100% { transform: translate(-50%, -50%) scale(1); } 50% { transform: translate(-52%, -46%) scale(1.15); } }
    @media (prefers-reduced-motion: reduce) {
      .orb { animation: none !important; }
    }

    .content-layer { position: relative; z-index: 1; }

    .logo-mark {
      background: linear-gradient(135deg, #2563eb, #7c3aed);
      box-shadow: 0 12px 30px -8px rgba(37, 99, 235, 0.45);
    }

    .eyebrow-pill {
      background: rgba(255, 255, 255, 0.65);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.7);
    }

    .gateway-card {
      position: relative;
      background: rgba(255, 255, 255, 0.66);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.6);
      overflow: hidden;
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.25s ease, border-color 0.25s ease;
    }
    .gateway-card::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      padding: 1.5px;
      background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      opacity: 0;
      transition: opacity 0.25s ease;
      pointer-events: none;
    }
    .gateway-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 24px 48px -16px rgba(15, 23, 42, 0.2);
    }
    .gateway-card:hover::before { opacity: 1; }

    .icon-badge {
      position: relative;
      background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
      box-shadow: 0 10px 24px -8px var(--accent-shadow);
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .gateway-card:hover .icon-badge {
      transform: scale(1.08) rotate(-4deg);
    }

    .cta-arrow {
      transition: transform 0.25s ease;
    }
    .gateway-card:hover .cta-arrow {
      transform: translateX(-4px);
    }
  </style>
</head>
<body class="font-tajawal text-slate-900 antialiased">
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>

  <div class="content-layer mx-auto flex min-h-screen max-w-4xl flex-col items-center justify-center px-4 py-12">
    <div class="mb-10 flex flex-col items-center gap-4 text-center">
      <div class="logo-mark flex h-16 w-16 items-center justify-center rounded-2xl text-white">
        <svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 10 12 5 2 10l10 5 10-5Z" />
          <path d="M6 12.5V17c0 1.5 2.7 3 6 3s6-1.5 6-3v-4.5" />
          <path d="M22 10v6" />
        </svg>
      </div>
      <span class="eyebrow-pill rounded-full px-4 py-1.5 text-xs font-bold text-brand-700">نظام تعليمي متكامل</span>
      <h1 class="text-3xl font-extrabold text-slate-900 sm:text-4xl">نظام EMIS</h1>
      <p class="max-w-md text-sm text-slate-500 sm:text-base">نظام إدارة معلومات الطلاب والأساتذة</p>
    </div>

    <div class="grid w-full grid-cols-1 gap-5 sm:grid-cols-2">
      <a href="login.html" class="gateway-card group flex flex-col items-center gap-4 rounded-3xl p-8 text-center shadow-lg shadow-slate-200/50" style="--accent-1:#3b82f6; --accent-2:#2563eb; --accent-shadow:rgba(37,99,235,0.35);">
        <div class="icon-badge flex h-16 w-16 items-center justify-center rounded-2xl text-white">
          <svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" />
            <circle cx="9" cy="7" r="4" />
            <path d="M22 21v-2a4 4 0 0 0-3-3.87" />
            <path d="M16 3.13a4 4 0 0 1 0 7.75" />
          </svg>
        </div>
        <div>
          <h2 class="text-lg font-extrabold text-slate-900">معلومات الطلاب</h2>
          <p class="mt-1 text-sm text-slate-500">الدخول إلى نظام EMIS لإدارة بيانات الطلاب</p>
        </div>
        <span class="mt-2 flex items-center gap-2 rounded-xl bg-brand-600 px-5 py-2.5 text-sm font-semibold text-white shadow-sm transition group-hover:bg-brand-700">
          تسجيل الدخول
          <svg class="cta-arrow" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5" /><path d="m11 18-6-6 6-6" /></svg>
        </span>
      </a>

      <a href="teacher-register.html" class="gateway-card group flex flex-col items-center gap-4 rounded-3xl p-8 text-center shadow-lg shadow-slate-200/50" style="--accent-1:#a78bfa; --accent-2:#7c3aed; --accent-shadow:rgba(124,58,237,0.35);">
        <div class="icon-badge flex h-16 w-16 items-center justify-center rounded-2xl text-white">
          <svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="7" width="20" height="14" rx="2" />
            <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16" />
            <path d="M2 13h20" />
          </svg>
        </div>
        <div>
          <h2 class="text-lg font-extrabold text-slate-900">تسجيل الأساتذة</h2>
          <p class="mt-1 text-sm text-slate-500">استمارة تسجيل بيانات الأستاذ — بدون الحاجة لتسجيل دخول</p>
        </div>
        <span class="mt-2 flex items-center gap-2 rounded-xl bg-violet-600 px-5 py-2.5 text-sm font-semibold text-white shadow-sm transition group-hover:bg-violet-700">
          فتح الاستمارة
          <svg class="cta-arrow" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5" /><path d="m11 18-6-6 6-6" /></svg>
        </span>
      </a>
    </div>

    <p class="mt-12 text-center text-xs text-slate-400">حقوق برمجة النظام محفوظة الاستاذ علي محمد علي ❤️</p>
  </div>
</body>
</html>
