<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>تسجيل الدخول - نظام EMIS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="js/tailwind-config.js"></script>
  <link rel="stylesheet" href="css/styles.css" />
  <style>
    html, body {
      height: 100%;
      overflow-x: hidden;
    }

    body {
      background: linear-gradient(160deg, #0b1330 0%, #142457 45%, #0b1330 100%);
      min-height: 100vh;
      position: relative;
    }

    /* ---------------------------------------------------------------
       Animated floating background shapes (pure CSS — no runtime lib
       needed for a handful of slow-drifting blurred blobs).
       --------------------------------------------------------------- */
    .emis-particles {
      position: fixed;
      inset: 0;
      overflow: hidden;
      z-index: 0;
      pointer-events: none;
    }
    .emis-blob {
      position: absolute;
      border-radius: 9999px;
      filter: blur(60px);
      opacity: 0.35;
      will-change: transform;
    }
    .emis-blob:nth-child(1) {
      width: 420px; height: 420px;
      top: -10%; right: -8%;
      background: radial-gradient(circle, #3b82f6, transparent 70%);
      animation: emis-float-a 22s ease-in-out infinite;
    }
    .emis-blob:nth-child(2) {
      width: 360px; height: 360px;
      bottom: -12%; left: -6%;
      background: radial-gradient(circle, #6366f1, transparent 70%);
      animation: emis-float-b 26s ease-in-out infinite;
    }
    .emis-blob:nth-child(3) {
      width: 260px; height: 260px;
      top: 40%; left: 55%;
      background: radial-gradient(circle, #22d3ee, transparent 70%);
      opacity: 0.22;
      animation: emis-float-c 30s ease-in-out infinite;
    }
    .emis-blob:nth-child(4) {
      width: 180px; height: 180px;
      top: 12%; left: 12%;
      background: radial-gradient(circle, #a78bfa, transparent 70%);
      opacity: 0.2;
      animation: emis-float-d 18s ease-in-out infinite;
    }

    @keyframes emis-float-a {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(-40px, 50px) scale(1.08); }
    }
    @keyframes emis-float-b {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(30px, -40px) scale(1.05); }
    }
    @keyframes emis-float-c {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(-25px, -35px); }
    }
    @keyframes emis-float-d {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(20px, 25px); }
    }

    /* ---------------------------------------------------------------
       Floating educational icons (book, pen, graduation cap, globe) —
       low opacity, slightly blurred, gently floating/rotating so they
       add depth without competing with the login card.
       --------------------------------------------------------------- */
    .emis-edu-icon {
      position: absolute;
      color: #93c5fd;
      opacity: 0.16;
      filter: blur(0.5px);
      will-change: transform;
    }
    .emis-edu-1 {
      width: 64px; height: 64px;
      top: 14%; left: 10%;
      animation: emis-edu-float-1 16s ease-in-out infinite;
    }
    .emis-edu-2 {
      width: 44px; height: 44px;
      top: 20%; right: 12%;
      opacity: 0.14;
      animation: emis-edu-float-2 13s ease-in-out infinite;
    }
    .emis-edu-3 {
      width: 72px; height: 72px;
      bottom: 16%; right: 8%;
      animation: emis-edu-float-3 19s ease-in-out infinite;
    }
    .emis-edu-4 {
      width: 56px; height: 56px;
      bottom: 12%; left: 9%;
      opacity: 0.13;
      animation: emis-edu-float-4 21s ease-in-out infinite;
    }

    @keyframes emis-edu-float-1 {
      0%, 100% { transform: translate(0, 0) rotate(0deg); }
      50% { transform: translate(14px, -20px) rotate(8deg); }
    }
    @keyframes emis-edu-float-2 {
      0%, 100% { transform: translate(0, 0) rotate(0deg); }
      50% { transform: translate(-12px, 16px) rotate(-10deg); }
    }
    @keyframes emis-edu-float-3 {
      0%, 100% { transform: translate(0, 0) rotate(0deg); }
      50% { transform: translate(-18px, -14px) rotate(6deg); }
    }
    @keyframes emis-edu-float-4 {
      0%, 100% { transform: translate(0, 0) rotate(0deg); }
      50% { transform: translate(10px, 18px) rotate(-7deg); }
    }

    @media (prefers-reduced-motion: reduce) {
      .emis-blob, .emis-edu-icon { animation: none !important; }
    }

    /* ---------------------------------------------------------------
       Entrance + glassmorphic card + glow focus states
       --------------------------------------------------------------- */
    @keyframes emis-fade-up {
      from { opacity: 0; transform: translateY(18px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .emis-card {
      animation: emis-fade-up 0.6s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    .emis-glass {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.14);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 20px 60px -15px rgba(0, 0, 0, 0.5);
    }

    .emis-input {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.14);
      color: #f8fafc;
      transition: border-color 0.2s ease, box-shadow 0.25s ease, background-color 0.2s ease;
    }
    .emis-input::placeholder { color: rgba(226, 232, 240, 0.4); }
    .emis-input:focus {
      border-color: rgba(96, 165, 250, 0.8);
      background: rgba(255, 255, 255, 0.1);
      box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.18), 0 0 24px rgba(59, 130, 246, 0.35);
    }

    .emis-btn {
      transition: transform 0.15s ease, box-shadow 0.2s ease, filter 0.2s ease;
    }
    .emis-btn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 14px 32px -10px rgba(59, 130, 246, 0.6);
      filter: brightness(1.06);
    }
    .emis-btn:active:not(:disabled) {
      transform: translateY(0);
    }

    .emis-logo {
      background: linear-gradient(135deg, #3b82f6, #6366f1);
      box-shadow: 0 0 0 6px rgba(59, 130, 246, 0.12), 0 12px 30px -8px rgba(59, 130, 246, 0.6);
    }
  </style>
</head>
<body class="font-tajawal text-slate-900 antialiased">
  <div class="emis-particles" aria-hidden="true">
    <div class="emis-blob"></div>
    <div class="emis-blob"></div>
    <div class="emis-blob"></div>
    <div class="emis-blob"></div>

    <!-- Floating educational icons: book, pen, graduation cap, globe -->
    <svg class="emis-edu-icon emis-edu-1" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path>
      <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path>
    </svg>
    <svg class="emis-edu-icon emis-edu-2" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"></path>
    </svg>
    <svg class="emis-edu-icon emis-edu-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="m22 10-10-5L2 10l10 5 10-5Z"></path>
      <path d="M6 12v5c0 1.5 2.7 3 6 3s6-1.5 6-3v-5"></path>
      <path d="M22 10v6"></path>
    </svg>
    <svg class="emis-edu-icon emis-edu-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="12" cy="12" r="10"></circle>
      <path d="M2 12h20"></path>
      <path d="M12 2a15 15 0 0 1 4 10 15 15 0 0 1-4 10 15 15 0 0 1-4-10 15 15 0 0 1 4-10Z"></path>
    </svg>
  </div>

  <div class="relative z-10 flex min-h-screen flex-col items-center justify-center px-4 py-10">
    <div class="emis-card w-full max-w-sm">
      <div class="mb-6 flex flex-col items-center gap-3 text-center">
        <div class="emis-logo flex h-14 w-14 items-center justify-center rounded-2xl text-xl font-extrabold text-white">
          E
        </div>
        <div>
          <h1 class="text-xl font-extrabold text-white">نظام EMIS</h1>
          <p class="mt-1 text-sm text-slate-300">تسجيل الدخول لإدارة بيانات الطلاب</p>
        </div>
      </div>

      <div class="emis-glass rounded-3xl p-7 sm:p-8">
        <form id="login-form" class="space-y-5">
          <div>
            <label for="email" class="mb-1.5 block text-sm font-semibold text-slate-200">البريد الإلكتروني</label>
            <input id="email" type="email" required dir="ltr" autocomplete="email"
              class="emis-input w-full rounded-xl px-4 py-2.5 text-sm outline-none" />
          </div>
          <div>
            <label for="password" class="mb-1.5 block text-sm font-semibold text-slate-200">كلمة المرور</label>
            <input id="password" type="password" required dir="ltr" autocomplete="current-password"
              class="emis-input w-full rounded-xl px-4 py-2.5 text-sm outline-none" />
          </div>

          <p id="login-error" class="hidden rounded-xl border border-rose-400/30 bg-rose-500/10 px-4 py-2.5 text-sm text-rose-200"></p>

          <button type="submit" id="login-btn"
            class="emis-btn flex w-full items-center justify-center gap-2 rounded-xl bg-gradient-to-l from-brand-500 to-indigo-600 px-4 py-3 text-sm font-bold text-white disabled:cursor-not-allowed disabled:opacity-60">
            <span id="login-btn-text">دخول</span>
          </button>
        </form>
      </div>
    </div>

    <footer class="mt-10 text-center text-xs text-slate-400">
      حقوق برمجة النظام محفوظة الاستاذ علي محمد علي ❤️
    </footer>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase-client.js"></script>
  <script>
    (async () => {
      const session = await getSession();
      if (session) window.location.href = "index.html";
    })();

    const form = document.getElementById("login-form");
    const errorEl = document.getElementById("login-error");
    const btn = document.getElementById("login-btn");
    const btnText = document.getElementById("login-btn-text");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorEl.classList.add("hidden");
      btn.disabled = true;
      btnText.textContent = "جارٍ الدخول...";

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      const { error } = await signInWithPassword(email, password);

      btn.disabled = false;
      btnText.textContent = "دخول";

      if (error) {
        errorEl.textContent = "بيانات الدخول غير صحيحة";
        errorEl.classList.remove("hidden");
        return;
      }
      window.location.href = "index.html";
    });
  </script>
</body>
</html>
